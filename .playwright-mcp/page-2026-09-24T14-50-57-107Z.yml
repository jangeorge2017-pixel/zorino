            - heading "Highlights" [level=2] [ref=f3e352]
            - heading "Immersive Curved Display with High Resolution" [level=3] [ref=f3e353]
            - paragraph [ref=f3e354]: The 27-inch screen features a 1500R curvature, following the natural curvature of your field of view more closely for a more immersive and comfortable experience. With a QHD resolution of 2560x1440, it delivers crisp, vibrant visuals for a stunning level of detail.
            - heading "180Hz Refresh Rate & 1ms Response Time" [level=3] [ref=f3e355]
            - paragraph [ref=f3e356]: Enjoy buttery-smooth gameplay with the H27S17's 180Hz refresh rate and 1ms (MPRT) response time. This high-performance monitor ensures minimal motion blur and instant response, perfect for competitive gaming.
            - heading "Vivid Colors & HDR10 for Realistic Visuals" [level=3] [ref=f3e357]
            - paragraph [ref=f3e358]: Covering 120% of the sRGB color gamut and supporting HDR10, the KTC H27S17 offers deeper, richer colors and enhanced contrast, providing true-to-life visuals that bring your games and media to life.
            - heading "Adaptive Sync for Tear-Free Gameplay" [level=3] [ref=f3e359]
            - paragraph [ref=f3e360]: Compatible with FreeSync and G-Sync, the H27S17 eliminates screen tearing and stuttering for a seamless, fluid gaming experience, ensuring smooth visuals in every frame.
            - heading "Low Blue Light & Flicker-Free Technology" [level=3] [ref=f3e361]
            - paragraph [ref=f3e362]: Protect your eyes during long gaming sessions with the H27S17's low blue light mode, which minimizes harmful blue light emissions. The monitor also operates without flicker, ensuring a comfortable viewing experience.
            - heading "Versatile Connectivity & Ergonomic Design" [level=3] [ref=f3e363]
            - paragraph [ref=f3e364]: The H27S17 offers a range of connectivity options, including USB 2.0, HDMI 2.0, and DP 1.4 ports, to accommodate various devices. Its sturdy stand and wall-mount capability provide flexible placement options, while the tilt functionality allows for customized viewing angles.
            - heading "More Gaming Features" [level=3] [ref=f3e365]
            - paragraph [ref=f3e366]: KTC H27S17 offers a couple of preset modes including FPS (First-Person Shooter), RTS (Real-Time Strategy), and RAC(Race Game) for your preference. Besides, key enhanced gaming features, such as Timer and Sniper Sight, are also provided to help improve gamers' performance.
