previews:
  generation: off

# Blueprint for the production Render service.
#
# The service described here is the live one:
#   name   zorino-1
#   URL    https://zorino-1.onrender.com
#   region virginia
#   runtime node (native), plan free
#
# The `name` MUST stay `zorino-1`: Render matches an existing service by name
# when a blueprint is applied, so any other name would create a second,
# duplicate service instead of updating the live one.
#
# The Docker deploy path lives in ./Dockerfile and is used by the separate
# `zorino` service (runtime: docker, same region/plan). It is not part of this
# blueprint on purpose — a single canonical service keeps the deploy story
# unambiguous.
services:
  - type: web
    name: zorino-1
    runtime: node
    region: virginia
    plan: free
    branch: main
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    # --include=dev keeps TypeScript/Tailwind available to `next build`. Render
    # exports service env vars during the build step, so never set
    # NODE_ENV=production here: npm would omit devDependencies and next build
    # exits 1. `next start` sets NODE_ENV=production itself.
    buildCommand: npm install; npm run build
    startCommand: npm run start
    envVars:
      # -- public runtime configuration (safe to keep in git) -----------------
      - key: NEXT_PUBLIC_SITE_URL
        value: https://zorino-1.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://trgzpvpzzfldtouikitc.supabase.co
      - key: ALIEXPRESS_AFFILIATE_BASE_URL
        value: https://s.click.aliexpress.com/deep_link.htm
      - key: EBAY_NOTIFICATION_ENDPOINT_URL
        value: https://zorino-1.onrender.com/api/ebay/notifications
      - key: EBAY_SANDBOX
        value: "false"
      - key: AMAZON_DIRECT_ENABLE
        value: "1"
      # -- secrets: values are kept in the Render dashboard, never in git ----
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_CAMPAIGN_ID
        sync: false
      - key: EBAY_OAUTH_TOKEN
        sync: false
      - key: EBAY_VERIFICATION_TOKEN
        sync: false
      - key: EBAY_REFERENCE_ID
        sync: false
