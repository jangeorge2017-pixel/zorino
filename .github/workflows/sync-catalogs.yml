name: Sync all catalogs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-catalogs.yml"
      - "lib/sync/**"
      - "lib/cron/**"
      - "lib/integration/**"
      - "lib/search/connectors/**"
      - "scripts/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-catalogs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "const missing=[];if(!process.env.SUPABASE_URL)missing.push('SUPABASE_URL');if(!process.env.SUPABASE_SERVICE_ROLE_KEY)missing.push('SUPABASE_SERVICE_ROLE_KEY');if(missing.length){console.error('Missing GitHub Secrets: '+missing.join(', '));process.exit(1)}"

      - name: Install Playwright Chromium
        continue-on-error: true
        run: npx playwright install chromium --with-deps

      - name: Sync Jumia sitemap catalog
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p logs
          node scripts/jumia-ingest.mjs 2>&1 | tee logs/jumia-sync.log

      - name: Sync all approved Admitad campaigns
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_MAX_FEEDS: ${{ vars.ADMITAD_MAX_FEEDS || '1000' }}
          ADMITAD_MAX_PRODUCTS_PER_FEED: ${{ vars.ADMITAD_MAX_PRODUCTS_PER_FEED || '5000' }}
          SYNC_DIAGNOSTICS: "1"
        run: |
          mkdir -p logs
          node scripts/admitad-api-ingest.mjs 2>&1 | tee logs/admitad-sync.log

      - name: Sync full Admitad program catalog
        continue-on-error: true
        timeout-minutes: 14
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_MAX_PRODUCTS_PER_FEED: ${{ vars.ADMITAD_MAX_PRODUCTS_PER_FEED || '5000' }}
          ADMITAD_FEED_TIMEOUT_MS: ${{ vars.ADMITAD_FEED_TIMEOUT_MS || '30000' }}
          ADMITAD_FEED_CONCURRENCY: ${{ vars.ADMITAD_FEED_CONCURRENCY || '8' }}
          ADMITAD_FULL_DEADLINE_MS: ${{ vars.ADMITAD_FULL_DEADLINE_MS || '840000' }}
          SYNC_DIAGNOSTICS: "1"
        run: |
          mkdir -p logs
          npx tsx scripts/sync-admitad-all.ts 2>&1 | tee logs/admitad-full-sweep.log

      - name: Purge broken product images
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p logs
          node scripts/purge-bad-product-images.mjs --concurrency=80 --timeout=5000 2>&1 | tee logs/image-purge.log

      - name: Ensure scraper stores are enabled
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-scraper-stores.mjs

      - name: Sync provider APIs and storefront catalogs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SYNC_BUDGET_MS: ${{ vars.SYNC_BUDGET_MS || '3000000' }}
          SYNC_GLOBAL_TIMEOUT_MS: ${{ vars.SYNC_GLOBAL_TIMEOUT_MS || '600000' }}
          SYNC_STORE_MAX_PRODUCTS: ${{ vars.SYNC_STORE_MAX_PRODUCTS || '3000' }}
          SYNC_STORE_QUERIES: "${{ vars.SYNC_STORE_QUERIES || 'Microwave,Refrigerator,Washing Machine,Air Fryer,Samsung Note Case,iPhone Case,Laptop,Smart TV' }}"
          SYNC_STORE_CONCURRENCY: ${{ vars.SYNC_STORE_CONCURRENCY || '6' }}
          SYNC_SCRAPER_ENABLED: "1"
          SYNC_SCRAPER_AUTO: "1"
          SYNC_DIAGNOSTICS: "1"
          SYNC_SCRAPER_PAGES: ${{ vars.SYNC_SCRAPER_PAGES || '5' }}
          SYNC_SCRAPER_PAGE_SIZE: ${{ vars.SYNC_SCRAPER_PAGE_SIZE || '24' }}
          SYNC_SCRAPER_PAGE_TIMEOUT_MS: ${{ vars.SYNC_SCRAPER_PAGE_TIMEOUT_MS || '20000' }}
          SYNC_SCRAPER_QUERIES: ${{ vars.SYNC_SCRAPER_QUERIES || '48' }}
          SYNC_SCRAPER_MAX_PRODUCTS: ${{ vars.SYNC_SCRAPER_MAX_PRODUCTS || '3000' }}
          AMAZON_SCRAPER_ENGINE: playwright
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          EBAY_OAUTH_TOKEN: ${{ secrets.EBAY_OAUTH_TOKEN }}
          AMAZON_DIRECT_ENABLE: "1"
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AMAZON_EG_ASSOCIATE_TAG: ${{ secrets.AMAZON_EG_ASSOCIATE_TAG }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          CJDROPSHIPPING_API_KEY: ${{ secrets.CJDROPSHIPPING_API_KEY }}
          WALMART_API_KEY: ${{ secrets.WALMART_API_KEY }}
          WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
          WALMART_PRIVATE_KEY: ${{ secrets.WALMART_PRIVATE_KEY }}
          WALMART_KEY_VERSION: ${{ secrets.WALMART_KEY_VERSION || '1' }}
          WALMART_PUBLISHER_ID: ${{ secrets.WALMART_PUBLISHER_ID }}
          WALMART_SEARCH_ENDPOINT: ${{ secrets.WALMART_SEARCH_ENDPOINT }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          JUMIA_AFF_PREFIX: ${{ secrets.JUMIA_AFF_PREFIX }}
          NOON_AFF_TAG: ${{ secrets.NOON_AFF_TAG }}
          TEMU_AFF_TAG: ${{ secrets.TEMU_AFF_TAG }}
          CARREFOUR_AFF_TAG: ${{ secrets.CARREFOUR_AFF_TAG }}
          BTECH_AFF_TAG: ${{ secrets.BTECH_AFF_TAG }}
          ARABCLICKS_API_KEY: ${{ secrets.ARABCLICKS_API_KEY }}
          ARABCLICKS_FEED_URL: ${{ secrets.ARABCLICKS_FEED_URL }}
          ARABCLICKS_FEED_SYNC_ENABLED: ${{ vars.ARABCLICKS_FEED_SYNC_ENABLED || 'false' }}
          ARABCLICKS_FEED_DRY_RUN: ${{ vars.ARABCLICKS_FEED_DRY_RUN || 'true' }}
        run: |
          mkdir -p logs
          set +e
          timeout --signal=TERM --kill-after=15s 600s npm run sync:catalogs 2>&1 | tee logs/provider-sync.log
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            124|137|143)
              echo "[sync-all-catalogs] external watchdog ended sync after 600s"
              exit 0
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: Invalidate search cache
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/invalidate-search-cache.ts

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-sync-logs
          path: logs/*
          retention-days: 14
          if-no-files-found: ignore
