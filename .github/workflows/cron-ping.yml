name: Render cron ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-cron-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ping lightweight health endpoint
        run: |
          base="${{ vars.RENDER_BASE_URL || 'https://zorino-1.onrender.com' }}"
          url="${base%/}/api/health"
          curl -fsS --max-time 10 -o /dev/null -w "%{http_code}\n" "$url"
